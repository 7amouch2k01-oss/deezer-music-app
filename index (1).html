<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>VibeTunes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="toast" class="toast" aria-live="polite"></div>

  <div id="shortcuts-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button id="shortcuts-close" class="modal-close" aria-label="Close">&times;</button>
      <h2 class="modal-title">Keyboard Shortcuts</h2>
      <ul class="shortcuts-list">
        <li><kbd>Space</kbd> Play / Pause</li>
        <li><kbd>&rarr;</kbd> Next track</li>
        <li><kbd>&larr;</kbd> Previous track</li>
        <li><kbd>L</kbd> Like / Unlike</li>
        <li><kbd>S</kbd> Toggle shuffle</li>
        <li><kbd>R</kbd> Cycle repeat</li>
        <li><kbd>M</kbd> Mute / Unmute</li>
        <li><kbd>?</kbd> Show this panel</li>
      </ul>
    </div>
  </div>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1 id="app-logo">VibeTunes</h1>
        <p id="app-tagline">Feel every beat</p>
      </div>
      <form id="search-form" role="search" autocomplete="off">
        <div class="search-wrapper">
          <span class="search-icon">&#9906;</span>
          <input id="search-input" type="search" placeholder="Search artists, songs, genres..." aria-label="Search music" />
          <button id="search-btn" type="submit">Search</button>
        </div>
      </form>
      <button id="shortcuts-btn" class="icon-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
    </div>
  </header>

  <main class="app-main">

    <section id="player-card" class="glass player-card" aria-label="Music player">
      <div id="album-art-wrapper" class="album-art-wrapper">
        <img id="album-art"
          src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3Crect fill='%23111122' width='1' height='1'/%3E%3C/svg%3E"
          alt="Album cover" />
        <div id="equalizer" class="equalizer hidden" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="song-info">
        <p id="song-title" class="song-title">Loading...</p>
        <p id="artist-name" class="artist-name">Please wait</p>
        <p id="album-name" class="album-name"></p>
      </div>

      <button id="like-btn" class="like-btn" aria-label="Like track" title="Like (L)">&#9825;</button>

      <div id="progress-wrapper" class="progress-wrapper">
        <span id="current-time">0:00</span>
        <input id="progress-bar" type="range" min="0" max="100" value="0" step="0.1" aria-label="Playback progress" />
        <span id="total-time">0:00</span>
      </div>

      <div id="controls" class="controls">
        <button id="shuffle-btn" class="ctrl-btn ctrl-sm" aria-label="Shuffle" title="Shuffle (S)">&#8942;&#8942;</button>
        <button id="prev-btn"    class="ctrl-btn ctrl-sm" aria-label="Previous">&#9664;&#9664;</button>
        <button id="play-pause-btn" class="ctrl-btn ctrl-lg" aria-label="Play">&#9654;</button>
        <button id="next-btn"    class="ctrl-btn ctrl-sm" aria-label="Next">&#9654;&#9654;</button>
        <button id="repeat-btn"  class="ctrl-btn ctrl-sm" aria-label="Repeat" title="Repeat (R)">&#8635;</button>
      </div>

      <div class="volume-row">
        <button id="mute-btn" class="icon-btn" aria-label="Mute" title="Mute (M)">&#128266;</button>
        <input id="volume-bar" type="range" min="0" max="1" value="1" step="0.01" aria-label="Volume" class="volume-bar" />
      </div>
    </section>

    <aside id="queue-panel" class="glass queue-panel" aria-label="Queue">
      <h2 class="panel-title">Queue</h2>
      <ul id="queue-list" class="queue-list" role="list"></ul>
    </aside>

  </main>

  <section id="top-tracks-section" class="top-tracks-section" aria-label="Top tracks">
    <h2 id="top-tracks-heading" class="section-heading">Top Tracks</h2>
    <div id="top-tracks-container" class="top-tracks-container" role="list"></div>
  </section>

  <div id="status-bar" class="status-bar" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
